<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLERC RFP Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #111210;
      --surface: #1a1b19;
      --surface-raised: #222320;
      --border: #2e2f2c;
      --border-light: #3a3b38;
      --text-primary: #e8e6e1;
      --text-secondary: #a09d95;
      --text-tertiary: #6b6862;
      --accent-green: #7dcea0;
      --accent-amber: #e2b760;
      --accent-red: #e07668;
      --accent-blue: #6ba3d6;
      --accent-purple: #b08fd6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      overflow-x: auto;
    }

    /* ── Top bar ── */
    .topbar {
      padding: 20px 28px 16px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 {
      font-family: 'Anybody', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .topbar h1 span {
      color: var(--accent-green);
    }

    .topbar-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-tertiary);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      display: inline-block;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Pipeline ── */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      min-height: calc(100vh - 70px);
      min-width: 900px;
    }

    .column {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .column:last-child { border-right: none; }

    .col-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--page-bg);
      z-index: 10;
    }

    .col-phase {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .col-sub {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .col-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    .col-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .col-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 11px;
      font-style: italic;
      opacity: 0.5;
    }

    /* ── Phase colors ── */
    .phase-site-walk .col-phase    { color: var(--accent-blue); }
    .phase-site-walk .col-count    { background: rgba(107,163,214,0.15); color: var(--accent-blue); }
    .phase-questions .col-phase    { color: var(--accent-amber); }
    .phase-questions .col-count    { background: rgba(226,183,96,0.15); color: var(--accent-amber); }
    .phase-bids .col-phase         { color: var(--accent-green); }
    .phase-bids .col-count         { background: rgba(125,206,160,0.15); color: var(--accent-green); }
    .phase-review .col-phase       { color: var(--accent-purple); }
    .phase-review .col-count       { background: rgba(176,143,214,0.15); color: var(--accent-purple); }
    .phase-complete .col-phase     { color: var(--text-tertiary); }
    .phase-complete .col-count     { background: rgba(107,104,98,0.15); color: var(--text-tertiary); }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      opacity: 0;
      animation: cardIn 0.35s ease-out forwards;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-light);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .card-grant {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .card-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    /* ── Urgent badge ── */
    .urgent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .urgent-badge .ub-label {
      font-size: 9px;
      font-weight: 500;
      opacity: 0.7;
      font-family: 'DM Sans', sans-serif;
    }

    .ub-crit { background: rgba(224,118,104,0.15); color: var(--accent-red); border: 1px solid rgba(224,118,104,0.3); }
    .ub-warn { background: rgba(226,183,96,0.12); color: var(--accent-amber); border: 1px solid rgba(226,183,96,0.25); }
    .ub-ok   { background: rgba(125,206,160,0.1); color: var(--accent-green); border: 1px solid rgba(125,206,160,0.2); }

    /* ── Milestone rows ── */
    .milestones { display: flex; flex-direction: column; gap: 1px; }

    .ms-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 3px 0;
      font-size: 11px;
      line-height: 1.4;
    }

    .ms-row.past {
      opacity: 0.35;
      text-decoration: line-through;
    }

    .ms-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .ms-dot-past     { background: #555; }
    .ms-dot-imminent { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); animation: pulse 1.5s ease-in-out infinite; }
    .ms-dot-soon     { background: var(--accent-amber); }
    .ms-dot-upcoming { background: var(--text-tertiary); }

    .ms-label {
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
    }

    .ms-val {
      color: var(--text-primary);
      font-weight: 600;
    }

    .ms-loc {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-left: 12px;
      margin-top: -2px;
      margin-bottom: 2px;
    }

    /* ── Card accent stripe ── */
    .card[data-accent="green"]  { border-left: 3px solid var(--accent-green); }
    .card[data-accent="amber"]  { border-left: 3px solid var(--accent-amber); }
    .card[data-accent="blue"]   { border-left: 3px solid var(--accent-blue); }
    .card[data-accent="purple"] { border-left: 3px solid var(--accent-purple); }
    .card[data-accent="gray"]   { border-left: 3px solid var(--text-tertiary); }

    .card-num-green  { background: rgba(125,206,160,0.15); color: var(--accent-green); }
    .card-num-amber  { background: rgba(226,183,96,0.15); color: var(--accent-amber); }
    .card-num-blue   { background: rgba(107,163,214,0.15); color: var(--accent-blue); }
    .card-num-purple { background: rgba(176,143,214,0.15); color: var(--accent-purple); }
    .card-num-gray   { background: rgba(107,104,98,0.2); color: var(--text-tertiary); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.6); }
    }

    /* ── Mobile: stack columns vertically ── */
    @media (max-width: 900px) {
      .pipeline {
        display: flex;
        flex-direction: column;
        min-width: unset;
      }
      .column {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .col-body { min-height: unset; }
    }
  </style>
</head>

// ── Phases (columns, left to right) ──
const PHASES = [
  { key: "site-walk",  label: "Pre-Site Walk",      sub: "Upcoming walkthrough", accent: "blue" },
  { key: "questions",  label: "Questions Open",      sub: "Submit questions",     accent: "amber" },
  { key: "bids",       label: "Bids Open",           sub: "Proposals accepted",   accent: "green" },
  { key: "review",     label: "Under Review",        sub: "Evaluation period",    accent: "purple" },
  { key: "complete",   label: "Awarded / Complete",   sub: "Work underway",        accent: "gray" },
];

// ── Helpers ──
function parseDate(s) {
  if (!s) return null;
  if (s.includes("T")) return new Date(s);
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function fmtShort(s) {
  if (!s) return "TBD";
  const d = parseDate(s);
  const day = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  if (s.includes("T")) {
    const t = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    return `${day}, ${t}`;
  }
  return day;
}

function getStatus(s) {
  if (!s) return "upcoming";
  const diff = parseDate(s) - new Date();
  if (diff <= 0) return "past";
  if (diff / 36e5 <= 48) return "imminent";
  if (diff / 36e5 <= 120) return "soon";
  return "upcoming";
}

function getPhaseKey(rfp) {
  const now = new Date();
  if (now < parseDate(rfp.siteWalk)) return "site-walk";
  if (now < parseDate(rfp.questionsDeadline)) return "questions";
  if (now < parseDate(rfp.proposalDeadline)) return "bids";
  if (now < parseDate(rfp.anticipatedAward)) return "review";
  return "complete";
}

function countdownText(s) {
  const diff = parseDate(s) - new Date();
  if (diff <= 0) return null;
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  const urgency = d <= 2 ? "crit" : d <= 5 ? "warn" : "ok";
  const text = d > 0 ? `${d}d ${h}h` : `${h}h`;
  return { text, urgency };
}

function nextDeadline(rfp) {
  const now = new Date();
  const steps = [
    { label: "Site Walk", date: rfp.siteWalk },
    { label: "Questions", date: rfp.questionsDeadline },
    { label: "Bids Due", date: rfp.proposalDeadline },
    { label: "Award", date: rfp.anticipatedAward },
  ];
  for (const s of steps) {
    if (parseDate(s.date) > now) return s;
  }
  return null;
}

// ── Render ──
function render() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleDateString("en-US", {
    weekday: "short", month: "short", day: "numeric", year: "numeric"
  }) + "  " + now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  const buckets = {};
  PHASES.forEach(p => buckets[p.key] = []);
  RFP_DATA.forEach(rfp => buckets[getPhaseKey(rfp)].push(rfp));

  Object.values(buckets).forEach(arr => {
    arr.sort((a, b) => {
      const na = nextDeadline(a), nb = nextDeadline(b);
      if (!na && !nb) return 0;
      if (!na) return 1;
      if (!nb) return -1;
      return parseDate(na.date) - parseDate(nb.date);
    });
  });

  let html = "";

  PHASES.forEach((phase, pi) => {
    const cards = buckets[phase.key];

    html += `<div class="column phase-${phase.key}">`;
    html += `<div class="col-header">
      <div class="col-phase">${phase.label}<span class="col-count">${cards.length}</span></div>
      <div class="col-sub">${phase.sub}</div>
    </div>`;
    html += `<div class="col-body">`;

    if (cards.length === 0) {
      html += `<div class="col-empty">No projects</div>`;
    }

    cards.forEach((rfp, ci) => {
      const accent = phase.accent;
      const nd = nextDeadline(rfp);

      let badge = "";
      if (nd) {
        const cd = countdownText(nd.date);
        if (cd) badge = `<div class="urgent-badge ub-${cd.urgency}"><span class="ub-label">${nd.label}</span> ${cd.text}</div>`;
      }

      const steps = [
        { label: "Site Walk", date: rfp.siteWalk, loc: rfp.siteWalkLocation },
        { label: "Questions", date: rfp.questionsDeadline },
        { label: "Bids Due",  date: rfp.proposalDeadline },
        { label: "Award",     date: rfp.anticipatedAward },
        { label: "Completion", date: rfp.anticipatedCompletion },
      ];

      let msHtml = "";
      steps.forEach(s => {
        const st = getStatus(s.date);
        const pastCls = st === "past" ? " past" : "";
        msHtml += `<div class="ms-row${pastCls}">
          <span class="ms-dot ms-dot-${st}"></span>
          <span class="ms-label">${s.label}</span>
          <span class="ms-val">${fmtShort(s.date)}</span>
        </div>`;
        if (s.loc && st !== "past") {
          msHtml += `<div class="ms-loc">${s.loc}</div>`;
        }
      });

      html += `<div class="card" data-accent="${accent}" style="animation-delay:${(pi * 0.1) + (ci * 0.06)}s">
        <div class="card-top">
          <span class="card-num card-num-${accent}">${rfp.number}</span>
          <span class="card-grant">${rfp.grant}</span>
        </div>
        <div class="card-name">${rfp.name}</div>
        ${badge}
        <div class="milestones">${msHtml}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  document.getElementById("pipeline").innerHTML = html;
}

render();
setInterval(render, 60000);
</script>
