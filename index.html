<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLERC RFP Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #f8f7f4;
      --card-bg: #ffffff;
      --card-border: #e5e2db;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-tertiary: #8a8a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 16px;
      color: var(--text-primary);
    }

    .wrap { max-width: 820px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .clock {
      font-size: 12px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .cards { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeSlideIn 0.4s ease-out forwards;
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rfp-num {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .rfp-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .phase-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card-body { padding: 12px 16px 14px; }

    .countdowns {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .countdown-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border-width: 1px;
      border-style: solid;
    }

    .countdown-badge .cb-label {
      font-size: 9px;
      opacity: 0.7;
    }

    .cb-high { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
    .cb-med  { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
    .cb-low  { background: #f0fdf4; border-color: #86efac; color: #166534; }

    .milestones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 20px;
    }

    .milestone {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 4px;
    }

    .milestone.past {
      opacity: 0.45;
      text-decoration: line-through;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 2px;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .dot-past     { background: #666; }
    .dot-imminent { background: #ef4444; animation: pulse 1.5s ease-in-out infinite; box-shadow: 0 0 6px #ef4444; }
    .dot-soon     { background: #f59e0b; }
    .dot-upcoming { background: #6b7280; }

    .m-label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-primary);
    }

    .m-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .m-location {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 1px;
    }

    .grant-label {
      font-size: 11px;
      color: var(--text-tertiary);
      align-self: end;
      padding-bottom: 4px;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.4); }
    }

    @media (max-width: 500px) {
      .milestones { grid-template-columns: 1fr; }
      .card-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ╔══════════════════════════════════════════════════════════════════╗
// ║  CLERC RFP TRACKER — EDIT THIS SECTION TO ADD/UPDATE RFPs      ║
// ║  Copy a block, paste it, change the values. That's it.         ║
// ╚══════════════════════════════════════════════════════════════════╝
const RFP_DATA = [
  {
    number: "RFP-0003",
    name: "Point Lakeview Phase 2",
    grant: "CWDG Round 2",
    released: "2026-04-17",
    siteWalk: "2026-04-23T11:00",
    siteWalkLocation: "Pt Lakeview Rd at Black Oak Dr",
    questionsDeadline: "2026-04-24T11:00",
    proposalDeadline: "2026-05-01T17:00",
    anticipatedAward: "2026-05-08",
    anticipatedCompletion: "2026-06-19",
  },
  {
    number: "RFP-0004",
    name: "Konocti Rd Below the Gate Phase 1",
    grant: "CWDG Round 1",
    released: "2026-04-23",
    siteWalk: "2026-04-30T13:00",
    siteWalkLocation: "Konocti Road, Kelseyville",
    questionsDeadline: "2026-05-01T13:00",
    proposalDeadline: "2026-05-08T17:00",
    anticipatedAward: "2026-05-15",
    anticipatedCompletion: "2026-06-26",
  },
  {
    number: "RFP-0013",
    name: "Sunrise Shores (Panorama Sunrise FB)",
    grant: "CWDG Round 2",
    released: "2026-04-30",
    siteWalk: "2026-05-07T11:00",
    siteWalkLocation: "6182 Sunrise Dr, Lower Lake",
    questionsDeadline: "2026-05-08T11:00",
    proposalDeadline: "2026-05-15T17:00",
    anticipatedAward: "2026-05-22",
    anticipatedCompletion: "2026-07-10",
  },
  // ── ADD NEW RFPs HERE ──────────────────────────────────
  // {
  //   number: "RFP-XXXX",
  //   name: "Project Name",
  //   grant: "Grant Name",
  //   released: "YYYY-MM-DD",
  //   siteWalk: "YYYY-MM-DDThh:mm",
  //   siteWalkLocation: "Location description",
  //   questionsDeadline: "YYYY-MM-DDThh:mm",
  //   proposalDeadline: "YYYY-MM-DDThh:mm",
  //   anticipatedAward: "YYYY-MM-DD",
  //   anticipatedCompletion: "YYYY-MM-DD",
  // },
];

// ── Row color schemes ──
const COLORS = [
  { bg: "#1b4332", accent: "#52b788", light: "#d8f3dc" },
  { bg: "#3a2e1c", accent: "#d4a24e", light: "#faecd4" },
  { bg: "#1a2744", accent: "#5e8bc9", light: "#d4e4f7" },
  { bg: "#3b1c3a", accent: "#c475bf", light: "#f3d8f1" },
  { bg: "#2d1b14", accent: "#d47a54", light: "#f5ddd0" },
  { bg: "#1c2d2d", accent: "#5bb8b8", light: "#d0f0f0" },
];

const PHASE_COLORS = {
  "Pre-Site Walk":      { bg: "#dbeafe", text: "#1e40af" },
  "Questions Open":     { bg: "#fef3c7", text: "#92400e" },
  "Bids Open":          { bg: "#d1fae5", text: "#065f46" },
  "Under Review":       { bg: "#ede9fe", text: "#5b21b6" },
  "Awarded / Complete": { bg: "#e5e7eb", text: "#374151" },
};

// ── Helpers ──

// Date-only strings ("2026-05-08") are parsed as UTC midnight by
// new Date(), which rolls back a day in US time zones. This helper
// treats date-only strings as local midnight instead.
function parseDate(s) {
  if (!s) return null;
  if (s.includes("T")) return new Date(s);
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(s) {
  if (!s) return "TBD";
  const d = parseDate(s);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function fmtTime(s) {
  if (!s || !s.includes("T")) return "";
  return parseDate(s).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function fmtFull(s) {
  if (!s) return "TBD";
  const d = parseDate(s);
  const day = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  return s.includes("T") ? `${day} at ${fmtTime(s)}` : day;
}

function getStatus(s) {
  if (!s) return "upcoming";
  const diff = parseDate(s) - new Date();
  if (diff <= 0) return "past";
  const hrs = diff / 36e5;
  if (hrs <= 48) return "imminent";
  if (hrs <= 120) return "soon";
  return "upcoming";
}

function getPhase(rfp) {
  const now = new Date();
  if (now < parseDate(rfp.siteWalk)) return "Pre-Site Walk";
  if (now < parseDate(rfp.questionsDeadline)) return "Questions Open";
  if (now < parseDate(rfp.proposalDeadline)) return "Bids Open";
  if (now < parseDate(rfp.anticipatedAward)) return "Under Review";
  return "Awarded / Complete";
}

function countdownText(s) {
  const diff = parseDate(s) - new Date();
  if (diff <= 0) return null;
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  const urgency = (d === 0) ? "high" : (d <= 2) ? "high" : (d <= 5) ? "med" : "low";
  const text = d > 0 ? `${d}d ${h}h` : `${h}h`;
  return { text, urgency };
}

// ── Render ──
function render() {
  const now = new Date();
  const sorted = [...RFP_DATA].sort((a, b) => {
    const ap = parseDate(a.proposalDeadline) < now;
    const bp = parseDate(b.proposalDeadline) < now;
    if (ap !== bp) return ap ? 1 : -1;
    return parseDate(a.proposalDeadline) - parseDate(b.proposalDeadline);
  });

  const clockStr = now.toLocaleDateString("en-US", {
    weekday: "short", month: "short", day: "numeric", year: "numeric"
  }) + " " + now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  let html = `
    <div class="header">
      <h1>CLERC RFP Tracker</h1>
      <span class="clock">${clockStr}</span>
    </div>
    <p class="subtitle">${sorted.length} open RFP${sorted.length !== 1 ? "s" : ""} &middot; Live countdowns update every minute</p>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> Due &lt; 48h</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> Due &lt; 5 days</div>
      <div class="legend-item"><span class="legend-dot" style="background:#6b7280"></span> Upcoming</div>
      <div class="legend-item"><span class="legend-dot" style="background:#666"></span> Past (struck)</div>
    </div>
    <div class="cards">
  `;

  sorted.forEach((rfp, i) => {
    const c = COLORS[i % COLORS.length];
    const phase = getPhase(rfp);
    const pc = PHASE_COLORS[phase];

    // Countdown badges
    let badges = "";
    const qc = getStatus(rfp.questionsDeadline) !== "past" ? countdownText(rfp.questionsDeadline) : null;
    const bc = getStatus(rfp.proposalDeadline) !== "past" ? countdownText(rfp.proposalDeadline) : null;
    if (qc) badges += `<span class="countdown-badge cb-${qc.urgency}"><span class="cb-label">Questions</span> ${qc.text}</span>`;
    if (bc) badges += `<span class="countdown-badge cb-${bc.urgency}"><span class="cb-label">Bids Due</span> ${bc.text}</span>`;

    // Milestones
    function milestone(label, dateStr, location) {
      const st = getStatus(dateStr);
      const pastClass = st === "past" ? " past" : "";
      const dotClass = "dot-" + st;
      let loc = "";
      if (location && st !== "past") {
        loc = `<div class="m-location">${location}</div>`;
      }
      return `
        <div class="milestone${pastClass}">
          <span class="status-dot ${dotClass}"></span>
          <div>
            <span class="m-label">${label}:</span>
            <span class="m-date">${fmtFull(dateStr)}</span>
            ${loc}
          </div>
        </div>`;
    }

    html += `
      <div class="card" style="animation-delay:${i * 0.08}s">
        <div class="card-header" style="background:${c.bg}">
          <div class="card-header-left">
            <span class="rfp-num" style="color:${c.accent}">${rfp.number}</span>
            <span class="rfp-name">${rfp.name}</span>
          </div>
          <span class="phase-tag" style="background:${pc.bg};color:${pc.text}">${phase}</span>
        </div>
        <div class="card-body">
          <div class="countdowns">${badges}</div>
          <div class="milestones">
            ${milestone("Site Walk", rfp.siteWalk, rfp.siteWalkLocation)}
            ${milestone("Questions Due", rfp.questionsDeadline)}
            ${milestone("Bids Due", rfp.proposalDeadline)}
            ${milestone("Award", rfp.anticipatedAward)}
            ${milestone("Completion", rfp.anticipatedCompletion)}
            <div class="grant-label">${rfp.grant}</div>
          </div>
        </div>
      </div>`;
  });

  html += "</div>";
  document.getElementById("app").innerHTML = html;
}

// Initial render + refresh every 60 seconds
render();
setInterval(render, 60000);
</script>
</body>
</html>
